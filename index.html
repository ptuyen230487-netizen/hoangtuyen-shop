<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HOÀNG TUYÊN</title><style>body{font-family:Arial;margin:0;background:#f0f4f8;padding-bottom:80px}.h{background:linear-gradient(135deg,#0077b6,#00b4d8);color:#fff;padding:16px;text-align:center;position:sticky;top:0}.h h1{margin:0;font-size:18px}.h p{margin:4px 0 0;font-size:12px}.s{padding:12px;background:#fff}.s input{width:100%;padding:10px;border:2px solid #e0e7ee;border-radius:25px;font-size:14px;box-sizing:border-box}.c{display:flex;gap:8px;padding:12px;overflow-x:auto;background:#fff}.c button{padding:8px 16px;border-radius:20px;border:2px solid #e0e7ee;background:#fff;font-size:13px;white-space:nowrap;font-weight:600}.c button.on{background:#0077b6;color:#fff}.l{padding:16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}.card{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.08)}.card img,.ni{width:100%;height:160px;object-fit:cover;background:#e0e7ee;display:flex;align-items:center;justify-content:center;color:#94a3b8;font-size:12px}.in{padding:10px}.nm{font-size:13px;font-weight:600;margin-bottom:6px;height:34px;overflow:hidden}.pr{font-size:15px;color:#e63946;font-weight:700}.st{font-size:11px;color:#64748b;margin-top:4px}.f{position:fixed;bottom:20px;right:20px;width:60px;height:60px;border-radius:50%;background:#0077b6;color:#fff;border:none;font-size:30px;box-shadow:0 4px 15px rgba(0,119,182,.4);z-index:200}.m{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);z-index:300;overflow-y:auto;padding:16px}.m.on{display:block}.bx{background:#fff;border-radius:16px;max-width:600px;margin:20px auto;padding:20px}.bx h2{font-size:18px;color:#0077b6;margin:0 0 16px}.cl{float:right;background:none;border:none;font-size:28px;color:#64748b}.fg{margin-bottom:14px}.fg label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}.fg input,.fg select,.fg textarea{width:100%;padding:10px;border:2px solid #e0e7ee;border-radius:8px;font-size:14px;box-sizing:border-box;font-family:inherit}.ims{display:flex;gap:8px;flex-wrap:wrap}.pv{width:70px;height:70px;object-fit:cover;border-radius:8px;border:2px solid #e0e7ee}.up{width:70px;height:70px;border:2px dashed #00b4d8;border-radius:8px;background:#f0f9ff;color:#0077b6;font-size:24px}.bt{padding:12px;border-radius:8px;border:none;font-size:14px;font-weight:600;width:100%;margin-top:8px}.bp{background:#0077b6;color:#fff}.bs{background:#e0e7ee;color:#334155}.bz{background:#0068ff;color:#fff}.pf{padding:10px;background:#f0f9ff;border-radius:8px;font-weight:700;color:#0077b6}.di{display:flex;gap:8px;overflow-x:auto;margin-bottom:16px}.di img{width:200px;height:200px;object-fit:cover;border-radius:12px;flex-shrink:0}.rw{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #f0f4f8;font-size:14px}.rw span:first-child{color:#64748b}.rw span:last-child{font-weight:600}.dp{font-size:24px;color:#e63946;font-weight:700;margin:12px 0}.ep{text-align:center;padding:60px 20px;color:#94a3b8;grid-column:1/-1}</style></head><body><div class="h"><h1>HOÀNG TUYÊN</h1><p>TƯ VẤN & THIẾT BỊ GIA ĐÌNH</p></div><div class="s"><input id="s" placeholder="🔍 Tìm sản phẩm..." oninput="render()"></div><div class="c" id="cats"></div><div class="l" id="list"></div><button class="f" onclick="openAdd()">+</button><div class="m" id="addM"><div class="bx"><button class="cl" onclick="closeM('addM')">×</button><h2 id="t">Thêm sản phẩm</h2><div class="fg"><label>Tên sản phẩm *</label><input id="n" placeholder="VD: Bồn cầu TOTO CS300"></div><div class="fg"><label>Danh mục *</label><select id="c"><option>Bồn cầu</option><option>Lavabo</option><option>Sen tắm</option><option>Bồn tiểu</option><option>Gương</option><option>Phụ kiện</option><option>Nồi, chảo</option><option>Đồ nhựa</option><option>Bàn ghế</option><option>Khác</option></select></div><div class="fg"><label>Mã sản phẩm</label><input id="code" placeholder="VD: CS300"></div><div class="fg"><label>Hình ảnh</label><div class="ims" id="imgs"></div><input type="file" id="f" accept="image/*" multiple style="display:none" onchange="addImg(event)"></div><div class="fg"><label>Giá nhập (đ)</label><input type="number" id="cost" oninput="calc()"></div><div class="fg"><label>Giá bán (đ)</label><input type="number" id="price" oninput="calc()"></div><div class="fg"><label>Lợi nhuận</label><div class="pf" id="profit">0 đ</div></div><div class="fg"><label>Tồn kho</label><input type="number" id="stock" value="0"></div><div class="fg"><label>Ghi chú</label><textarea id="note" rows="3"></textarea></div><button class="bt bp" onclick="saveP()">💾 Lưu</button><button class="bt bs" onclick="closeM('addM')">Hủy</button></div></div><div class="m" id="detM"><div class="bx"><button class="cl" onclick="closeM('detM')">×</button><h2>Chi tiết</h2><div id="det"></div><button class="bt bz" onclick="orderZalo()">💬 Đặt hàng qua Zalo</button><button class="bt bs" onclick="editP()">✏️ Sửa</button><button class="bt bs" style="background:#fee2e2;color:#991b1b" onclick="delP()">🗑️ Xóa</button></div></div><script>const ZALO="0838667789",CATS=["Tất cả","Bồn cầu","Lavabo","Sen tắm","Bồn tiểu","Gương","Phụ kiện","Nồi, chảo","Đồ nhựa","Bàn ghế","Khác"];let ps=JSON.parse(localStorage.getItem("hoangtuyen")||"[]"),curCat="Tất cả",curImgs=[],editId=null,curId=null;function save(){localStorage.setItem("hoangtuyen",JSON.stringify(ps))}function fmt(n){return n?Number(n).toLocaleString("vi-VN"):"0"}function renderCats(){document.getElementById("cats").innerHTML=CATS.map(c=>`<button class="${c===curCat?"on":""}" onclick="setCat('${c}')">${c}</button>`).join("")}function setCat(c){curCat=c;renderCats();render()}function render(){const s=document.getElementById("s").value.toLowerCase(),f=ps.filter(p=>(curCat==="Tất cả"||p.category===curCat)&&(!s||p.name.toLowerCase().includes(s)||(p.code||"").toLowerCase().includes(s))),el=document.getElementById("list");if(!f.length){el.innerHTML='<div class="ep"><div style="font-size:60px">📦</div><p>Chưa có sản phẩm</p></div>';return}el.innerHTML=f.map(p=>`<div class="card" onclick="openDet('${p.id}')">${p.images&&p.images[0]?`<img src="${p.images[0]}">`:'<div class="ni">📷 Chưa có ảnh</div>'}<div class="in"><div class="nm">${p.name}</div><div class="pr">${fmt(p.price)}đ</div><div class="st">Tồn: ${p.stock||0} | ${p.category}</div></div></div>`).join("")}function openAdd(){editId=null;curImgs=[];document.getElementById("t").textContent="Thêm sản phẩm";["n","code","cost","price","note"].forEach(i=>document.getElementById(i).value="");document.getElementById("c").value="Bồn cầu";document.getElementById("stock").value="0";document.getElementById("profit").textContent="0 đ";renderImgs();document.getElementById("addM").classList.add("on")}function closeM(id){document.getElementById(id).classList.remove("on")}function addImg(e){Array.from(e.target.files).forEach(f=>{const r=new FileReader();r.onload=ev=>{curImgs.push(ev.target.result);renderImgs()};r.readAsDataURL(f)});e.target.value=""}function renderImgs(){document.getElementById("imgs").innerHTML=curImgs.map((im,i)=>`<div style="position:relative"><img src="${im}" class="pv"><button onclick="rmImg(${i})" style="position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;background:#e63946;color:#fff;border:none;font-size:14px">×</button></div>`).join("")+'<button class="up" onclick="document.getElementById(\'f\').click()">+</button>'}function rmImg(i){curImgs.splice(i,1);renderImgs()}function calc(){const c=+document.getElementById("cost").value||0,p=+document.getElementById("price").value||0,d=p-c,el=document.getElementById("profit");el.textContent=fmt(d)+" đ";el.style.color=d>=0?"#166534":"#991b1b";el.style.background=d>=0?"#dcfce7":"#fee2e2"}function saveP(){const n=document.getElementById("n").value.trim();if(!n)return alert("Nhập tên!");const p={id:editId||Date.now().toString(),name:n,category:document.getElementById("c").value,code:document.getElementById("code").value.trim(),images:[...curImgs],cost:+document.getElementById("cost").value||0,price:+document.getElementById("price").value||0,stock:+document.getElementById("stock").value||0,note:document.getElementById("note").value.trim()};if(editId)ps=ps.map(x=>x.id===editId?p:x);else ps.unshift(p);save();render();closeM("addM")}function openDet(id){curId=id;const p=ps.find(x=>x.id===id);if(!p)return;const im=p.images&&p.images.length?`<div class="di">${p.images.map(i=>`<img src="${i}">`).join("")}</div>`:'<div style="text-align:center;padding:30px;background:#f0f4f8;border-radius:12px;color:#94a3b8;margin-bottom:16px">📷 Chưa có ảnh</div>',pr=p.price-p.cost;document.getElementById("det").innerHTML=`${im}<h2 style="font-size:18px;margin-bottom:8px">${p.name}</h2>${p.code?`<p style="color:#64748b;font-size:13px">Mã: ${p.code}</p>`:""}<div class="dp">${fmt(p.price)}đ</div><div class="rw"><span>Danh mục</span><span>${p.category}</span></div><div class="rw"><span>Giá nhập</span><span>${fmt(p.cost)}đ</span></div><div class="rw"><span>Lợi nhuận</span><span style="color:${pr>=0?"#166534":"#991b1b"}">${fmt(pr)}đ</span></div><div class="rw"><span>Tồn kho</span><span>${p.stock||0}</span></div>${p.note?`<div style="margin-top:12px;padding:12px;background:#f0f4f8;border-radius:8px;font-size:13px"><b>Ghi chú:</b><br>${p.note}</div>`:""}`;document.getElementById("detM").classList.add("on")}function editP(){const p=ps.find(x=>x.id===curId);if(!p)return;closeM("detM");editId=p.id;curImgs=[...(p.images||[])];document.getElementById("t").textContent="Sửa sản phẩm";document.getElementById("n").value=p.name;document.getElementById("c").value=p.category;document.getElementById("code").value=p.code||"";document.getElementById("cost").value=p.cost||"";document.getElementById("price").value=p.price||"";document.getElementById("stock").value=p.stock||0;document.getElementById("note").value=p.note||"";renderImgs();calc();document.getElementById("addM").classList.add("on")}function delP(){if(!confirm("Xóa sản phẩm này?"))return;ps=ps.filter(p=>p.id!==curId);save();render();closeM("detM")}function orderZalo(){window.open("https://zalo.me/"+ZALO,"_blank")}renderCats();render();</script></body></html>
